name: Generar i publicar índex HTML

on:
  push:
    branches:
      - main  # Canvia a 'master' si la teva branca principal es diu així

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar el codi
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executar script per generar index.html
        run: python generate_index.py

      - name: Guardar i fer commit de index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generar index.html" && git push)
